<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>HALO Virales</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>HALO Virales</h1>
    <p class="sub">Saca los reels más virales y los manda al panel.</p>

    <label>Qué analizar
      <select id="modo">
        <option value="referencias">Cuentas de referencia → Ideas virales</option>
        <option value="propias">Cuentas de mis modelos → Virales propios</option>
      </select>
    </label>
    <label id="fila-categoria">Tipo de cuenta
      <select id="categoria">
        <option value="todas">Todos los tipos</option>
        <option value="frases">Frases + música</option>
        <option value="hablado">Contenido hablado</option>
        <option value="referencia">Referencia visual</option>
        <option value="general">General</option>
      </select>
    </label>
    <details id="selector">
      <summary id="resumenCuentas">Todas las cuentas</summary>
      <input id="buscaCuenta" type="search" placeholder="Buscar cuenta…" />
      <div class="acciones">
        <button id="selVisibles" class="enlace">Elegir las que se ven</button>
        <button id="selNinguna" class="enlace">Ninguna (= todas)</button>
      </div>
      <div id="listaCuentas"></div>
    </details>
    <label>Reels de los últimos
      <select id="dias">
        <option value="0" selected>Automático (14 días referencias · 6 meses mis modelos)</option>
        <option value="7">7 días</option>
        <option value="14">14 días</option>
        <option value="30">30 días</option>
        <option value="90">90 días</option>
        <option value="180">6 meses</option>
        <option value="365">1 año</option>
      </select>
    </label>

    <div class="botones">
      <button id="analizar" class="primario">Analizar</button>
      <button id="cancelar" class="secundario" hidden>Cancelar</button>
    </div>
    <button id="metricas" class="secundario ancho" title="Vuelve a leer visitas, likes, comentarios y compartidos de los vídeos ya guardados">Actualizar métricas de los vídeos guardados</button>

    <ul id="cuentas"></ul>
    <div id="log"></div>

    <details>
      <summary>Ajustes</summary>
      <label>URL del panel
        <input id="panelUrl" type="url" placeholder="https://halo-panel.vercel.app" />
      </label>
      <button id="guardar" class="secundario">Guardar</button>
      <a id="abrirPanel" href="#" target="_blank">Abrir el panel</a>
    </details>
    <script src="popup.js" type="module"></script>
  </body>
</html>
